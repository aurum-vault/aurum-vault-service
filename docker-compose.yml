version: "3.9"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: aurum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum_secret
      POSTGRES_DB: aurum_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum_vault"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: aurum-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: aurum
      KC_DB_PASSWORD: aurum_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  api:
    build: .
    container_name: aurum-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aurum:aurum_secret@postgres:5432/aurum_vault
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: aurum-vault
      KEYCLOAK_CLIENT_ID: aurum-vault-api
      KEYCLOAK_CLIENT_SECRET: aurum-api-secret
      PORT: "3001"
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
